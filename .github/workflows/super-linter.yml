# This workflow executes several linters on changed files based on languages used in your code base whenever
# you push a code or open a pull request.
#
# You can adjust the behavior by modifying this file.
# For more information, see:
# https://github.com/github/super-linter
name: Lint Code Base

on:
  pull_request:
    branches: "master"
  push:
    branches: "master"

permissions:
  contents: write
  statuses: write
  pull-requests: write

jobs:
  lint-and-fix:
    name: Lint and Auto-Fix Codebase
    runs-on: ubuntu-latest

    if: |
      !contains(github.event.head_commit.message, '[skip ci]') && 
      !contains(github.event.head_commit.message, '#style-fix')

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint and Fix Codebase
        uses: super-linter/super-linter@v8
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_ALL_CODEBASE: true
          FIX_CSHARP: true
          FILTER_REGEX_EXCLUDE: '.*\.github/workflows/.*'
          DISABLE_ERRORS: true

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: auto-fix formatting errors [skip ci] #style-fix"
          branch: ${{ github.event.pull_request.head.ref || github.ref_name }}
