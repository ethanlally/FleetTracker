<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>FleetTrackerClient</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
    window.onerror = function(msg, url, lineNo, columnNo, error) {
      document.body.innerHTML += '<div style="color:red; margin: 20px; font-family: monospace;"><b>Error:</b> ' + msg + '<br>Line: ' + lineNo + '<br>Stack: ' + (error && error.stack) + '</div>';
      return false;
    };
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
